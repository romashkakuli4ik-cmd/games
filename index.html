<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dynamic App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151b2b;
      --border: #232d42;
      --accent: #f59e0b;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --btn: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; padding-bottom: 90px; user-select: none; }

    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { font-size: 20px; color: var(--accent); }
    .header p { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
    .row { display: flex; justify-content: space-between; align-items: center; }

    .btn { background: var(--btn); color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-qty { width: 30px; height: 30px; background: #232d42; border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 16px; font-weight: bold; }

    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 12px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .order-btn { background: #16a34a; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }

    /* Панель создателя */
    #adminFab {
      display: none; position: fixed; top: 10px; right: 10px; z-index: 999;
      background: linear-gradient(135deg, #9333ea, #4f46e5); color: #fff;
      border: none; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer;
    }
    #adminModal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      z-index: 1000; padding: 16px; overflow-y: auto;
    }
    .admin-box { background: #111827; border: 1px solid #6366f1; border-radius: 12px; padding: 14px; }
    .admin-input { width: 100%; background: #030712; border: 1px solid #374151; color: #fff; padding: 8px; border-radius: 6px; margin: 6px 0 10px; }

    /* Рулетка / Казино */
    .wheel-box { text-align: center; padding: 20px 0; }
    .wheel-val { font-size: 42px; font-weight: 900; color: #fbbf24; margin: 15px 0; }
  </style>
</head>
<body>

  <button id="adminFab" onclick="toggleAdmin()">⚙️ ПУЛЬТ СОЗДАТЕЛЯ</button>

  <div class="header">
    <h1 id="appTitle">Магазин</h1>
    <p id="appSub">Выберите товары</p>
  </div>

  <!-- РЕЖИМ 1: МАГАЗИН (Свечи / Продукты / Одежда) -->
  <div id="storeView">
    <div id="catalogList"></div>
  </div>

  <!-- РЕЖИМ 2: КАЗИНО / РУЛЕТКА -->
  <div id="casinoView" style="display: none;">
    <div class="card wheel-box">
      <div>Баланс: <b id="casBalance" style="color: #22c55e;">1000</b> монет</div>
      <div class="wheel-val" id="wheelDigit">🎰 777</div>
      <button class="btn" style="background: #e11d48; padding: 12px 24px; font-size: 16px;" onclick="spinWheel()">КРУТИТЬ (100 монет)</button>
    </div>
  </div>

  <!-- РЕЖИМ КОРЗИНЫ ДЛЯ МАГАЗИНА -->
  <div id="cartView" style="display: none;">
    <button class="btn" style="background: #374151; margin-bottom: 12px;" onclick="showCatalog()">← Назад</button>
    <div class="card" id="cartList"></div>
    <div class="card" style="border-style: dashed;">
      <div class="row"><span>Итого:</span><b style="font-size: 18px; color: var(--accent);" id="cartFinalSum">0 ₽</b></div>
    </div>
  </div>

  <!-- НИЖНЯЯ ПАНЕЛЬ -->
  <div class="bottom-bar" id="mainBar">
    <div>
      <div style="font-size: 11px; color: var(--muted);" id="barLabel">В корзине:</div>
      <div style="font-size: 16px; font-weight: bold; color: var(--accent);"><span id="barSum">0</span> <span id="barUnit">₽</span></div>
    </div>
    <button class="order-btn" id="btnOrder" onclick="onBarBtnClick()">Оформить ➔</button>
  </div>

  <!-- АДМИН-КОНСОЛЬ (ТОЛЬКО ДЛЯ ТЕБЯ) -->
  <div id="adminModal">
    <div class="admin-box">
      <h2 style="color: #a5b4fc; font-size: 16px; margin-bottom: 8px;">👑 Консоль Создателя</h2>
      <p style="font-size: 11px; color: var(--muted); margin-bottom: 12px;">Изменение конфигурации сайта на лету:</p>

      <label style="font-size: 11px;">Переключить шаблон сайта:</label>
      <div style="display: flex; gap: 6px; margin: 6px 0 12px;">
        <button class="btn" style="font-size: 11px;" onclick="applyPreset('candles')">🕯 Свечи</button>
        <button class="btn" style="font-size: 11px; background: #059669;" onclick="applyPreset('grocery')">🍎 Продукты</button>
        <button class="btn" style="font-size: 11px; background: #dc2626;" onclick="applyPreset('casino')">🎰 Казино</button>
      </div>

      <label style="font-size: 11px;">Прямая инъекция (Добавить свой товар):</label>
      <input id="injName" class="admin-input" placeholder="Название (напр. Чипсы Lays или Рулетка VIP)">
      <input id="injPrice" type="number" class="admin-input" placeholder="Цена / Стоимость">
      <button class="btn" style="width: 100%; margin-bottom: 12px;" onclick="injectCustomItem()">Вставить в проект</button>

      <button class="btn" style="width: 100%; background: #374151;" onclick="toggleAdmin()">Закрыть</button>
    </div>
  </div>

  <script>
    const OWNER_ID = 8732002956;
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe?.user?.id === OWNER_ID) {
        document.getElementById("adminFab").style.display = "block";
      }
    } else {
      document.getElementById("adminFab").style.display = "block";
    }

    // ГОТОВЫЕ ШАБЛОНЫ
    const PRESETS = {
      candles: {
        title: "🕯 Мастерская Свечей",
        sub: "100% натуральный пчелиный воск",
        mode: "store",
        currency: "₽",
        items: [
          { id: "c1", name: "Иерусалимские свечи (33 шт)", desc: "Натуральный воск, факел", price: 450 },
          { id: "c2", name: "Свечи из вощины (медовые)", desc: "Высота 13 см, пасечный воск", price: 180 },
          { id: "c3", name: "Травяная алтарная свеча", desc: "Чабрец, лаванда, полынь", price: 250 }
        ]
      },
      grocery: {
        title: "🛒 Продуктовый Экспресс",
        sub: "Свежая доставка за 15 минут",
        mode: "store",
        currency: "₽",
        items: [
          { id: "g1", name: "Молоко фермерское 3.2%", desc: "Пастеризованное, 900 мл", price: 89 },
          { id: "g2", name: "Хлеб ремесленный горячий", desc: "Хрустящая корочка, 400 г", price: 65 },
          { id: "g3", name: "Сыр пармезан колотый", desc: "Выдержка 12 месяцев, 150 г", price: 280 }
        ]
      },
      casino: {
        title: "🎰 Royal Telegram Casino",
        sub: "Испытай свою удачу",
        mode: "casino",
        currency: "COIN",
        items: []
      }
    };

    let config = JSON.parse(localStorage.getItem("app_config")) || PRESETS.candles;
    let cart = {};
    let casinoCoins = 1000;

    function applyConfig() {
      document.getElementById("appTitle").innerText = config.title;
      document.getElementById("appSub").innerText = config.sub;
      document.getElementById("barUnit").innerText = config.currency;

      if (config.mode === "casino") {
        document.getElementById("storeView").style.display = "none";
        document.getElementById("cartView").style.display = "none";
        document.getElementById("casinoView").style.display = "block";
        document.getElementById("barLabel").innerText = "Текущий банк:";
        document.getElementById("barSum").innerText = casinoCoins;
        document.getElementById("btnOrder").innerText = "Забрать куш 💸";
      } else {
        document.getElementById("casinoView").style.display = "none";
        document.getElementById("storeView").style.display = "block";
        document.getElementById("barLabel").innerText = "В корзине:";
        document.getElementById("btnOrder").innerText = "Оформить ➔";
        renderStore();
      }
    }

    function renderStore() {
      const box = document.getElementById("catalogList");
      box.innerHTML = config.items.map(i => {
        const q = cart[i.id] || 0;
        return `
          <div class="card row">
            <div>
              <div style="font-weight: bold; font-size: 14px;">${i.name}</div>
              <div style="font-size: 12px; color: var(--muted);">${i.desc || ''}</div>
              <div style="color: var(--accent); font-weight: bold; margin-top: 4px;">${i.price} ${config.currency}</div>
            </div>
            <div>
              ${q === 0 ? `
                <button class="btn" onclick="addQty('${i.id}', 1)">+ В заказ</button>
              ` : `
                <div class="row" style="gap: 6px;">
                  <button class="btn-qty" onclick="addQty('${i.id}', -1)">-</button>
                  <b style="min-width: 18px; text-align: center;">${q}</b>
                  <button class="btn-qty" onclick="addQty('${i.id}', 1)">+</button>
                </div>
              `}
            </div>
          </div>
        `;
      }).join("");
      updateBar();
    }

    function addQty(id, delta) {
      cart[id] = (cart[id] || 0) + delta;
      if (cart[id] <= 0) delete cart[id];
      renderStore();
      if (document.getElementById("cartView").style.display === "block") renderCart();
    }

    function updateBar() {
      let sum = 0;
      for (let id in cart) {
        const item = config.items.find(x => x.id === id);
        if (item) sum += item.price * cart[id];
      }
      document.getElementById("barSum").innerText = sum;
    }

    function onBarBtnClick() {
      if (config.mode === "casino") {
        sendPayload({ type: "casino_cashout", balance: casinoCoins });
      } else {
        showCart();
      }
    }

    function showCart() {
      document.getElementById("storeView").style.display = "none";
      document.getElementById("cartView").style.display = "block";
      document.getElementById("btnOrder").innerText = "Подтвердить заказ ✨";
      document.getElementById("btnOrder").onclick = finalizeStoreOrder;
      renderCart();
    }

    function showCatalog() {
      document.getElementById("cartView").style.display = "none";
      document.getElementById("storeView").style.display = "block";
      document.getElementById("btnOrder").innerText = "Оформить ➔";
      document.getElementById("btnOrder").onclick = onBarBtnClick;
      renderStore();
    }

    function renderCart() {
      let sum = 0;
      let html = "";
      for (let id in cart) {
        const item = config.items.find(x => x.id === id);
        if (item) {
          const cost = item.price * cart[id];
          sum += cost;
          html += `
            <div class="row" style="padding: 8px 0; border-bottom: 1px solid var(--border);">
              <div><b>${item.name}</b><br><span style="font-size: 12px; color: var(--muted);">${cart[id]} × ${item.price}</span></div>
              <div style="font-weight: bold; color: var(--accent);">${cost} ${config.currency}</div>
            </div>
          `;
        }
      }
      document.getElementById("cartList").innerHTML = html || "Пусто";
      document.getElementById("cartFinalSum").innerText = sum + " " + config.currency;
    }

    function finalizeStoreOrder() {
      const order = [];
      let total = 0;
      for (let id in cart) {
        const item = config.items.find(x => x.id === id);
        if (item) {
          order.push({ name: item.name, qty: cart[id], price: item.price, sum: item.price * cart[id] });
          total += item.price * cart[id];
        }
      }
      sendPayload({ type: "store_order", category: config.title, items: order, total: total });
    }

    function spinWheel() {
      if (casinoCoins < 100) { alert("Недостаточно монет!"); return; }
      casinoCoins -= 100;
      const symbols = ["🍒", "🍋", "🍇", "💎", "777"];
      const pick = symbols[Math.floor(Math.random() * symbols.length)];
      document.getElementById("wheelDigit").innerText = pick;

      if (pick === "777" || pick === "💎") {
        casinoCoins += 500;
        alert("ДЖЕКПОТ! +500 монет!");
      }
      document.getElementById("casBalance").innerText = casinoCoins;
      document.getElementById("barSum").innerText = casinoCoins;
    }

    function sendPayload(data) {
      if (tg && tg.initData) {
        tg.sendData(JSON.stringify(data));
      } else {
        alert("Данные для бота: " + JSON.stringify(data));
      }
    }

    /* АДМИНКА */
    function toggleAdmin() {
      const m = document.getElementById("adminModal");
      m.style.display = m.style.display === "block" ? "none" : "block";
    }

    function applyPreset(name) {
      config = PRESETS[name];
      cart = {};
      localStorage.setItem("app_config", JSON.stringify(config));
      applyConfig();
      toggleAdmin();
    }

    function injectCustomItem() {
      const n = document.getElementById("injName").value.trim();
      const p = parseInt(document.getElementById("injPrice").value);
      if (!n || !p) return;
      config.items.push({ id: "item_" + Date.now(), name: n, desc: "Пользовательский объект", price: p });
      localStorage.setItem("app_config", JSON.stringify(config));
      applyConfig();
      toggleAdmin();
    }

    applyConfig();
  </script>
</body>
</html>

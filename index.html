<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Медовая Мастерская Свечей</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-dark: #0f0b06;
      --card-bg: rgba(26, 18, 11, 0.85);
      --card-border: #f59e0b;
      --gold-primary: #d97706;
      --gold-light: #fbbf24;
      --text-main: #fef3c7;
      --text-muted: #d1b89d;
      --btn-grad: linear-gradient(135deg, #f59e0b, #b45309);
      --btn-green: linear-gradient(135deg, #10b981, #047857);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background-color: var(--bg-dark);
      /* Фон: медовые соты */
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.08) 0%, transparent 60%),
        repeating-linear-gradient(60deg, rgba(245, 158, 11, 0.05) 0 2px, transparent 2px 40px),
        repeating-linear-gradient(-60deg, rgba(245, 158, 11, 0.05) 0 2px, transparent 2px 40px),
        repeating-linear-gradient(0deg, rgba(245, 158, 11, 0.05) 0 2px, transparent 2px 40px);
      color: var(--text-main);
      padding: 14px;
      padding-bottom: 96px;
      user-select: none;
      position: relative;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Анимированные пчёлки */
    .bee {
      position: fixed;
      pointer-events: none; /* Не перехватывают клики и касания */
      animation: flyAround 14s infinite alternate ease-in-out;
      will-change: transform;
    }

    /* Слой пчёлок ЗА карточками */
    .bee-back { z-index: 1; opacity: 0.55; }
    /* Слой пчёлок ПЕРЕД карточками */
    .bee-front { z-index: 50; opacity: 0.95; }

    /* Размеры пчёлок */
    .bee-sm { font-size: 16px; }
    .bee-md { font-size: 24px; }
    .bee-lg { font-size: 32px; filter: drop-shadow(0 2px 6px rgba(245, 158, 11, 0.5)); }

    /* Индивидуальные траектории полёта */
    .b1 { top: 12%; left: 8%; animation-duration: 16s; animation-delay: 0s; }
    .b2 { top: 38%; right: 6%; animation-duration: 20s; animation-delay: -4s; }
    .b3 { top: 65%; left: 14%; animation-duration: 18s; animation-delay: -2s; }
    .b4 { top: 22%; right: 20%; animation-duration: 13s; animation-delay: -7s; }
    .b5 { top: 82%; right: 10%; animation-duration: 15s; animation-delay: -1s; }
    .b6 { top: 5%; right: 35%; animation-duration: 22s; animation-delay: -5s; }

    @keyframes flyAround {
      0%   { transform: translate(0, 0) rotate(0deg) scaleX(1); }
      25%  { transform: translate(35px, 20px) rotate(10deg) scaleX(1); }
      50%  { transform: translate(15px, 50px) rotate(-8deg) scaleX(-1); }
      75%  { transform: translate(-30px, 25px) rotate(5deg) scaleX(-1); }
      100% { transform: translate(-10px, -20px) rotate(-5deg) scaleX(1); }
    }

    .main-wrap { position: relative; z-index: 10; }

    .header { text-align: center; margin-bottom: 18px; }
    .header h1 {
      font-size: 22px;
      color: var(--gold-light);
      text-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
      letter-spacing: 0.5px;
    }
    .header p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    /* Стильные медовые карточки */
    .honey-card {
      background: var(--card-bg);
      border: 1px solid rgba(245, 158, 11, 0.35);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 0 12px rgba(245, 158, 11, 0.05);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .item-row { display: flex; justify-content: space-between; align-items: center; }
    .item-details { flex: 1; padding-right: 12px; }
    .item-name { font-size: 15px; font-weight: 700; color: #fff; }
    .item-desc { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.35; }
    .item-price { font-size: 15px; color: var(--gold-light); font-weight: 800; margin-top: 6px; }

    /* Новые золотые кнопки */
    .btn-honey-add {
      background: var(--btn-grad);
      color: #fff;
      border: none;
      padding: 9px 15px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(217, 119, 6, 0.35);
    }
    .btn-honey-add:active { transform: scale(0.96); }

    .counter-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 11, 6, 0.85);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 10px;
      padding: 3px;
    }
    .btn-count {
      background: rgba(245, 158, 11, 0.15);
      border: none;
      color: var(--gold-light);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-count:active { background: rgba(245, 158, 11, 0.3); }
    .count-num { font-size: 14px; font-weight: bold; min-width: 22px; text-align: center; color: #fff; }

    .btn-return {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 14px;
    }

    .bottom-glass {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(17, 12, 7, 0.94);
      border-top: 1px solid rgba(245, 158, 11, 0.35);
      backdrop-filter: blur(12px);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .btn-checkout {
      background: var(--btn-green);
      color: #fff;
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    .btn-checkout:disabled { opacity: 0.35; box-shadow: none; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- ПЧЁЛКИ ЗА ТОВАРАМИ -->
  <div class="bee bee-back bee-sm b1">🐝</div>
  <div class="bee bee-back bee-lg b2">🐝</div>
  <div class="bee bee-back bee-md b3">🐝</div>

  <!-- ОСНОВНОЙ КОНТЕНТ МАГАЗИНА -->
  <div class="main-wrap">
    
    <!-- СТРАНИЦА 1: ВИТРИНА -->
    <div id="pageCatalog">
      <div class="header">
        <h1>🍯 Пасечная Мастерская</h1>
        <p>100% натуральный пчелиный воск & медовый аромат</p>
      </div>

      <div id="catalogList"></div>

      <div class="bottom-glass">
        <div>
          <div style="font-size: 11px; color: var(--text-muted);">В корзине: <span id="barCount">0</span> шт.</div>
          <div style="font-size: 17px; font-weight: 800; color: var(--gold-light);"><span id="barTotal">0</span> ₽</div>
        </div>
        <button class="btn-checkout" id="btnGoToCart" disabled onclick="openCartPage()">В корзину ➔</button>
      </div>
    </div>

    <!-- СТРАНИЦА 2: ОФОРМЛЕНИЕ -->
    <div id="pageCart" style="display: none;">
      <button class="btn-return" onclick="openCatalogPage()">← Назад к свечам</button>

      <div class="header" style="text-align: left; margin-bottom: 12px;">
        <h1>🛒 Оформление заказа</h1>
        <p>Проверьте выбранные свечи перед подтверждением</p>
      </div>

      <div class="honey-card" id="cartItemsList"></div>

      <div class="honey-card" style="border-style: dashed; background: rgba(15, 11, 6, 0.7);">
        <div style="display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px;">
          <span>Свечей в наборе:</span>
          <b id="cartTotalItemsCount">0 шт.</b>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 16px;">
          <span>Итоговая сумма:</span>
          <b style="color: var(--gold-light); font-size: 19px;" id="cartFinalSum">0 ₽</b>
        </div>
      </div>

      <div class="bottom-glass">
        <div>
          <div style="font-size: 11px; color: var(--text-muted);">К оплате:</div>
          <div style="font-size: 17px; font-weight: 800; color: var(--gold-light);"><span id="barCartTotal">0</span> ₽</div>
        </div>
        <button class="btn-checkout" onclick="sendOrderToBot()">Оформить заказ ✨</button>
      </div>
    </div>

  </div>

  <!-- ПЧЁЛКИ ПЕРЕД ТОВАРАМИ -->
  <div class="bee bee-front bee-md b4">🐝</div>
  <div class="bee bee-front bee-sm b5">🐝</div>
  <div class="bee bee-front bee-lg b6">🐝</div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const PRODUCTS = [
      { id: "c1", name: "🕯 Иерусалимский факел (33 свечи)", desc: "100% пасечный воск, обожжённые в Иерусалиме", price: 450 },
      { id: "c2", name: "🍯 Медовые свечи из вощины", desc: "Высота 13 см, насыщенный аромат прополиса и мёда", price: 180 },
      { id: "c3", name: "🌿 Травяная алтарная скрутка", desc: "С добавлением крымской лаванды, чабреца и полыни", price: 250 },
      { id: "c4", name: "✨ Конусные свечи №40 (набор 10 шт)", desc: "Высота 20 см, чистое и ровное горение без копоти", price: 220 }
    ];

    let cart = {};

    function renderCatalog() {
      const container = document.getElementById("catalogList");
      container.innerHTML = PRODUCTS.map(p => {
        const qty = cart[p.id] || 0;
        return `
          <div class="honey-card">
            <div class="item-row">
              <div class="item-details">
                <div class="item-name">${p.name}</div>
                <div class="item-desc">${p.desc}</div>
                <div class="item-price">${p.price} ₽</div>
              </div>
              <div>
                ${qty === 0 ? `
                  <button class="btn-honey-add" onclick="changeQty('${p.id}', 1)">+ В заказ</button>
                ` : `
                  <div class="counter-wrap">
                    <button class="btn-count" onclick="changeQty('${p.id}', -1)">-</button>
                    <span class="count-num">${qty}</span>
                    <button class="btn-count" onclick="changeQty('${p.id}', 1)">+</button>
                  </div>
                `}
              </div>
            </div>
          </div>
        `;
      }).join("");

      updateCatalogBar();
    }

    function changeQty(productId, delta) {
      const current = cart[productId] || 0;
      const next = current + delta;
      if (next <= 0) {
        delete cart[productId];
      } else {
        cart[productId] = next;
      }
      renderCatalog();
      if (document.getElementById("pageCart").style.display === "block") {
        renderCartPage();
      }
    }

    function updateCatalogBar() {
      let totalCount = 0;
      let totalPrice = 0;

      for (const [pId, q] of Object.entries(cart)) {
        const prod = PRODUCTS.find(p => p.id === pId);
        if (prod) {
          totalCount += q;
          totalPrice += prod.price * q;
        }
      }

      document.getElementById("barCount").innerText = totalCount;
      document.getElementById("barTotal").innerText = totalPrice;
      document.getElementById("btnGoToCart").disabled = totalCount === 0;
    }

    function openCartPage() {
      document.getElementById("pageCatalog").style.display = "none";
      document.getElementById("pageCart").style.display = "block";
      renderCartPage();
      window.scrollTo(0, 0);
    }

    function openCatalogPage() {
      document.getElementById("pageCart").style.display = "none";
      document.getElementById("pageCatalog").style.display = "block";
      renderCatalog();
    }

    function renderCartPage() {
      const box = document.getElementById("cartItemsList");
      const orderItems = [];
      let totalSum = 0;
      let totalCount = 0;

      for (const [pId, q] of Object.entries(cart)) {
        const prod = PRODUCTS.find(p => p.id === pId);
        if (prod) {
          orderItems.push({ ...prod, qty: q, subtotal: prod.price * q });
          totalSum += prod.price * q;
          totalCount += q;
        }
      }

      if (orderItems.length === 0) {
        openCatalogPage();
        return;
      }

      box.innerHTML = orderItems.map(item => `
        <div class="item-row" style="padding: 9px 0; border-bottom: 1px solid rgba(245, 158, 11, 0.2);">
          <div>
            <div style="font-size: 14px; font-weight: bold; color: #fff;">${item.name}</div>
            <div style="font-size: 12px; color: var(--text-muted);">${item.qty} × ${item.price} ₽ = <b style="color: var(--gold-light);">${item.subtotal} ₽</b></div>
          </div>
          <div class="counter-wrap">
            <button class="btn-count" onclick="changeQty('${item.id}', -1)">-</button>
            <span class="count-num">${item.qty}</span>
            <button class="btn-count" onclick="changeQty('${item.id}', 1)">+</button>
          </div>
        </div>
      `).join("");

      document.getElementById("cartTotalItemsCount").innerText = totalCount + " шт.";
      document.getElementById("cartFinalSum").innerText = totalSum + " ₽";
      document.getElementById("barCartTotal").innerText = totalSum;
    }

    function sendOrderToBot() {
      const orderItems = [];
      let totalSum = 0;

      for (const [pId, q] of Object.entries(cart)) {
        const prod = PRODUCTS.find(p => p.id === pId);
        if (prod) {
          orderItems.push({
            name: prod.name,
            qty: q,
            price: prod.price,
            subtotal: prod.price * q
          });
          totalSum += prod.price * q;
        }
      }

      if (orderItems.length === 0) return;

      const payload = {
        action: "new_order",
        items: orderItems,
        total: totalSum
      };

      if (tg && tg.initData) {
        tg.sendData(JSON.stringify(payload));
      } else {
        alert(`Заказ на сумму ${totalSum} ₽ сформирован!`);
      }
    }

    renderCatalog();
  </script>
</body>
</html>

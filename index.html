<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мастерская Свечей</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --accent: #f59e0b;
      --text: #f0f6fc;
      --muted: #8b949e;
      --success: #238636;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; padding-bottom: 90px; user-select: none; }

    .header { text-align: center; margin-bottom: 16px; position: relative; }
    .header h1 { font-size: 20px; color: var(--accent); }
    .header p { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; margin-bottom: 12px;
    }

    .catalog-item { display: flex; justify-content: space-between; align-items: center; }
    .item-info { flex: 1; padding-right: 10px; }
    .item-title { font-size: 14px; font-weight: bold; }
    .item-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .item-price { font-size: 14px; color: var(--accent); font-weight: bold; margin-top: 4px; }

    .qty-controls { display: flex; align-items: center; gap: 8px; }
    .btn-qty {
      background: #21262d; border: 1px solid var(--border); color: #fff;
      width: 32px; height: 32px; border-radius: 6px; font-size: 16px; font-weight: bold;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .btn-qty:active { background: #30363d; }
    .qty-display { font-size: 14px; font-weight: bold; min-width: 20px; text-align: center; }

    .btn-add-main {
      background: #d97706; color: #fff; border: none; padding: 8px 14px;
      border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
    }

    .cart-view-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .cart-view-item:last-child { border-bottom: none; }

    .btn-back {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold;
      cursor: pointer; margin-bottom: 12px; display: inline-flex; align-items: center; gap: 4px;
    }

    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
      border-top: 1px solid var(--border); padding: 12px 16px; display: flex;
      justify-content: space-between; align-items: center; z-index: 100;
    }
    .order-btn {
      background: var(--success); color: #fff; border: none; padding: 12px 20px;
      border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer;
    }
    .order-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- СТРАНИЦА 1: КАТАЛОГ -->
  <div id="pageCatalog">
    <div class="header">
      <h1>🕯 Мастерская Свечей</h1>
      <p>100% натуральный пчелиный воск & ручная работа</p>
    </div>

    <div id="catalogList"></div>

    <div class="bottom-bar">
      <div>
        <div style="font-size: 11px; color: var(--muted);">В заказе: <span id="barCount">0</span> шт.</div>
        <div style="font-size: 16px; font-weight: bold; color: var(--accent);"><span id="barTotal">0</span> ₽</div>
      </div>
      <button class="order-btn" id="btnGoToCart" disabled onclick="openCartPage()">Оформить заказ ➔</button>
    </div>
  </div>

  <!-- СТРАНИЦА 2: КОРЗИНА -->
  <div id="pageCart" style="display: none;">
    <button class="btn-back" onclick="openCatalogPage()">← Назад в каталог</button>

    <div class="header" style="text-align: left; margin-bottom: 12px;">
      <h1>🛒 Ваша корзина</h1>
      <p>Проверьте товары перед отправкой мастеру</p>
    </div>

    <div class="card" id="cartItemsList"></div>

    <div class="card" style="background: #090d13; border-style: dashed;">
      <div style="display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px;">
        <span>Товаров в заказе:</span>
        <b id="cartTotalItemsCount">0 шт.</b>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 16px;">
        <span>Итого к оплате:</span>
        <b style="color: var(--accent); font-size: 18px;" id="cartFinalSum">0 ₽</b>
      </div>
    </div>

    <div class="bottom-bar">
      <div>
        <div style="font-size: 11px; color: var(--muted);">Сумма:</div>
        <div style="font-size: 16px; font-weight: bold; color: var(--accent);"><span id="barCartTotal">0</span> ₽</div>
      </div>
      <button class="order-btn" onclick="sendOrderToBot()">Заказать ✨</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const PRODUCTS = [
      { id: "c1", name: "🕯 Иерусалимские свечи (33 шт)", desc: "Натуральный воск, обожжённые в Иерусалиме", price: 450 },
      { id: "c2", name: "🍯 Свечи из вощины (медовые)", desc: "Высота 13 см, пасечный воск", price: 180 },
      { id: "c3", name: "🌿 Травяная алтарная свеча", desc: "Чабрец, лаванда, полынь", price: 250 },
      { id: "c4", name: "✨ Конусные свечи №40 (10 шт)", desc: "Длина 20 см, ровное горение", price: 220 }
    ];

    let cart = {};

    function renderCatalog() {
      const container = document.getElementById("catalogList");
      container.innerHTML = PRODUCTS.map(p => {
        const qty = cart[p.id] || 0;
        return `
          <div class="card">
            <div class="catalog-item">
              <div class="item-info">
                <div class="item-title">${p.name}</div>
                <div class="item-desc">${p.desc}</div>
                <div class="item-price">${p.price} ₽ / шт.</div>
              </div>
              <div>
                ${qty === 0 ? `
                  <button class="btn-add-main" onclick="changeQty('${p.id}', 1)">+ В заказ</button>
                ` : `
                  <div class="qty-controls">
                    <button class="btn-qty" onclick="changeQty('${p.id}', -1)">-</button>
                    <span class="qty-display">${qty}</span>
                    <button class="btn-qty" onclick="changeQty('${p.id}', 1)">+</button>
                  </div>
                `}
              </div>
            </div>
          </div>
        `;
      }).join("");

      updateCatalogBar();
    }

    function changeQty(productId, delta) {
      const current = cart[productId] || 0;
      const next = current + delta;
      if (next <= 0) {
        delete cart[productId];
      } else {
        cart[productId] = next;
      }
      renderCatalog();
      if (document.getElementById("pageCart").style.display === "block") {
        renderCartPage();
      }
    }

    function updateCatalogBar() {
      let totalCount = 0;
      let totalPrice = 0;

      for (const [pId, q] of Object.entries(cart)) {
        const prod = PRODUCTS.find(p => p.id === pId);
        if (prod) {
          totalCount += q;
          totalPrice += prod.price * q;
        }
      }

      document.getElementById("barCount").innerText = totalCount;
      document.getElementById("barTotal").innerText = totalPrice;
      document.getElementById("btnGoToCart").disabled = totalCount === 0;
    }

    function openCartPage() {
      document.getElementById("pageCatalog").style.display = "none";
      document.getElementById("pageCart").style.display = "block";
      renderCartPage();
      window.scrollTo(0, 0);
    }

    function openCatalogPage() {
      document.getElementById("pageCart").style.display = "none";
      document.getElementById("pageCatalog").style.display = "block";
      renderCatalog();
    }

    function renderCartPage() {
      const box = document.getElementById("cartItemsList");
      const orderItems = [];
      let totalSum = 0;
      let totalCount = 0;

      for (const [pId, q] of Object.entries(cart)) {
        const prod = PRODUCTS.find(p => p.id === pId);
        if (prod) {
          orderItems.push({ ...prod, qty: q, subtotal: prod.price * q });
          totalSum += prod.price * q;
          totalCount += q;
        }
      }

      if (orderItems.length === 0) {
        openCatalogPage();
        return;
      }

      box.innerHTML = orderItems.map(item => `
        <div class="cart-view-item">
          <div>
            <div style="font-size: 13px; font-weight: bold;">${item.name}</div>
            <div style="font-size: 12px; color: var(--muted);">${item.qty} × ${item.price} ₽ = <b style="color: var(--accent);">${item.subtotal} ₽</b></div>
          </div>
          <div class="qty-controls">
            <button class="btn-qty" onclick="changeQty('${item.id}', -1)">-</button>
            <span class="qty-display">${item.qty}</span>
            <button class="btn-qty" onclick="changeQty('${item.id}', 1)">+</button>
          </div>
        </div>
      `).join("");

      document.getElementById("cartTotalItemsCount").innerText = totalCount + " шт.";
      document.getElementById("cartFinalSum").innerText = totalSum + " ₽";
      document.getElementById("barCartTotal").innerText = totalSum;
    }

    function sendOrderToBot() {
      const orderItems = [];
      let totalSum = 0;

      for (const [pId, q] of Object.entries(cart)) {
        const prod = PRODUCTS.find(p => p.id === pId);
        if (prod) {
          orderItems.push({
            name: prod.name,
            qty: q,
            price: prod.price,
            subtotal: prod.price * q
          });
          totalSum += prod.price * q;
        }
      }

      if (orderItems.length === 0) return;

      const payload = {
        action: "new_order",
        items: orderItems,
        total: totalSum
      };

      if (tg && tg.initData) {
        tg.sendData(JSON.stringify(payload));
      } else {
        alert(`Заказ на сумму ${totalSum} ₽ сформирован!`);
      }
    }

    renderCatalog();
  </script>
</body>
</html>

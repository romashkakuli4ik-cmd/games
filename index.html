<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS2 UPGRADER & CASES</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #07080a;
            --bg-card: #0c0d11;
            --bg-panel: #111318;
            --accent-yellow: #ffd000;
            --accent-glow: rgba(255, 208, 0, 0.4);
            --border-dim: #1d212a;
            --border-bright: #2d3342;
            --text-main: #f0f2f5;
            --text-muted: #727a8c;
            --win-color: #ffd000;
            --loss-color: #ef4444;
            --gold: #e4ae39;
            --red: #eb4b4b;
            --pink: #d32ce6;
            --purple: #8847ff;
            --blue: #4b69ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background: var(--bg-card);
            border-bottom: 2px solid var(--border-dim);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 1px;
            color: #fff;
        }

        .brand span {
            color: var(--accent-yellow);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .balance-chip {
            background: var(--bg-panel);
            border: 1px solid var(--border-bright);
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-yellow);
        }

        .balance-chip span {
            color: var(--text-main);
        }

        .btn-steam {
            background: linear-gradient(135deg, #171a21, #1e232d);
            border: 1px solid #3d4454;
            color: #c5c3c0;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-steam:hover {
            border-color: var(--accent-yellow);
            color: #fff;
        }

        .live-drops-bar {
            background: #050608;
            border-bottom: 1px solid var(--border-dim);
            height: 60px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
        }

        .live-drops-track {
            display: flex;
            gap: 10px;
            position: absolute;
            white-space: nowrap;
            will-change: transform;
        }

        .mini-drop-card {
            width: 110px;
            height: 48px;
            background: var(--bg-card);
            border-radius: 6px;
            border-bottom: 3px solid var(--blue);
            display: flex;
            align-items: center;
            padding: 4px 8px;
            gap: 6px;
            flex-shrink: 0;
        }

        .mini-drop-card img {
            width: 38px;
            height: 30px;
            object-fit: contain;
        }

        .mini-drop-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .mini-drop-info .name {
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-drop-info .price {
            font-size: 10px;
            color: var(--accent-yellow);
            font-weight: 700;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 16px 20px;
            background: var(--bg-base);
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-dim);
            color: var(--text-muted);
            padding: 10px 24px;
            border-radius: 8px;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-yellow);
            color: #000;
            border-color: var(--accent-yellow);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        main {
            flex: 1;
            padding: 0 16px 30px 16px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* UPGRADER STYLES */
        .upgrader-wrapper {
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            gap: 20px;
            margin-top: 10px;
        }

        @media (max-width: 992px) {
            .upgrader-wrapper {
                grid-template-columns: 1fr;
            }
        }

        .upgrade-col {
            background: var(--bg-card);
            border: 1px solid var(--border-dim);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 480px;
        }

        .col-title {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-dim);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .active-slot {
            height: 180px;
            background: var(--bg-panel);
            border: 2px dashed var(--border-bright);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            position: relative;
        }

        .active-slot.filled {
            border: 1px solid var(--accent-yellow);
            box-shadow: inset 0 0 15px rgba(255, 208, 0, 0.1);
        }

        .active-slot img {
            width: 120px;
            height: 90px;
            object-fit: contain;
        }

        .active-slot-name {
            font-weight: 700;
            font-size: 13px;
            margin-top: 6px;
            text-align: center;
        }

        .active-slot-price {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            color: var(--accent-yellow);
            font-size: 15px;
        }

        .selector-list {
            flex: 1;
            overflow-y: auto;
            max-height: 260px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }

        .selector-list::-webkit-scrollbar {
            width: 4px;
        }

        .selector-list::-webkit-scrollbar-thumb {
            background: var(--border-bright);
            border-radius: 4px;
        }

        .skin-item {
            background: var(--bg-panel);
            border: 1px solid var(--border-dim);
            border-radius: 6px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .skin-item:hover {
            border-color: var(--accent-yellow);
            background: #151820;
        }

        .skin-item.selected {
            border-color: var(--accent-yellow);
            background: rgba(255, 208, 0, 0.08);
        }

        .skin-item img {
            width: 40px;
            height: 32px;
            object-fit: contain;
        }

        .skin-item-info {
            flex: 1;
            overflow: hidden;
        }

        .skin-item-name {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .skin-item-price {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 12px;
            color: var(--accent-yellow);
            font-weight: 700;
        }

        .upgrader-center {
            background: var(--bg-card);
            border: 1px solid var(--border-dim);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .wheel-container {
            width: 290px;
            height: 290px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg.radial-track {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        circle {
            fill: none;
            stroke-width: 14;
        }

        .circle-bg {
            stroke: #171922;
        }

        .circle-bar {
            stroke: var(--accent-yellow);
            stroke-linecap: round;
            stroke-dasharray: 816.8;
            stroke-dashoffset: 816.8;
            transition: stroke-dashoffset 0.3s ease;
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        .wheel-arrow {
            position: absolute;
            width: 4px;
            height: 135px;
            transform-origin: bottom center;
            bottom: 50%;
            left: calc(50% - 2px);
            pointer-events: none;
            transition: transform cubic-bezier(0.12, 0.8, 0.2, 1);
        }

        .wheel-arrow::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 14px solid #fff;
            filter: drop-shadow(0 0 6px #fff);
        }

        .wheel-center-info {
            position: absolute;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chance-text {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 38px;
            font-weight: 900;
            color: #fff;
        }

        .chance-sub {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .btn-upgrade {
            background: var(--accent-yellow);
            border: none;
            color: #000;
            width: 100%;
            max-width: 320px;
            padding: 16px;
            border-radius: 8px;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 24px;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: transform 0.1s, filter 0.2s;
        }

        .btn-upgrade:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(1);
            box-shadow: none;
        }

        .btn-upgrade:active:not(:disabled) {
            transform: scale(0.98);
        }

        /* CASES STYLES */
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 10px;
        }

        .case-card {
            background: var(--bg-card);
            border: 1px solid var(--border-dim);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .case-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-yellow);
            box-shadow: 0 8px 24px rgba(255, 208, 0, 0.15);
        }

        .case-card img {
            width: 140px;
            height: 110px;
            object-fit: contain;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.5));
        }

        .case-title {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 15px;
            margin-top: 10px;
            color: #fff;
        }

        .case-price {
            font-family: 'Chakra Petch', sans-serif;
            color: var(--accent-yellow);
            font-weight: 900;
            font-size: 16px;
            margin-top: 4px;
        }

        /* MODAL ROULETTE */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(4, 5, 7, 0.92);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .case-open-box {
            background: var(--bg-card);
            border: 1px solid var(--border-bright);
            width: 100%;
            max-width: 820px;
            border-radius: 14px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        .roulette-wrapper {
            width: 100%;
            height: 150px;
            background: #06070a;
            border: 2px solid var(--border-bright);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            margin: 20px 0;
        }

        .roulette-cursor {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 3px;
            background: var(--accent-yellow);
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 10px var(--accent-yellow);
        }

        .roulette-cursor::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 10px solid var(--accent-yellow);
        }

        .roulette-track {
            display: flex;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            will-change: transform;
        }

        .roulette-card {
            width: 130px;
            height: 100%;
            border-right: 1px solid var(--border-dim);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            flex-shrink: 0;
            position: relative;
        }

        .roulette-card img {
            width: 75px;
            height: 55px;
            object-fit: contain;
        }

        .roulette-card .name {
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
            margin-top: 4px;
        }

        .roulette-card .tier-line {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
        }

        .btn-modal-action {
            background: var(--accent-yellow);
            color: #000;
            border: none;
            padding: 12px 36px;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 16px;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* STEAM MODAL */
        .steam-modal {
            background: var(--bg-card);
            border: 1px solid var(--border-bright);
            width: 100%;
            max-width: 440px;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .steam-modal h3 {
            font-family: 'Chakra Petch', sans-serif;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .input-group input {
            background: var(--bg-panel);
            border: 1px solid var(--border-bright);
            padding: 10px 12px;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent-yellow);
        }

        .rarity-gold { color: var(--gold); }
        .rarity-red { color: var(--red); }
        .rarity-pink { color: var(--pink); }
        .rarity-purple { color: var(--purple); }
        .rarity-blue { color: var(--blue); }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            UPGRADER<span>.CS2</span>
        </div>
        <div class="header-actions">
            <div class="balance-chip">
                <span>₽</span>
                <span id="user-balance">5000.00</span>
            </div>
            <button class="btn-steam" onclick="openSteamModal()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.09 3.16 9.44 7.64 11.19l3.86-5.63A4.5 4.5 0 0 1 11 15.5a4.5 4.5 0 0 1 4.5-4.5h.06l2.94-4.28C17.06 6.26 14.67 6 12 6c-3.31 0-6 2.69-6 6 0 .54.08 1.06.21 1.56L2.3 15.2C1.49 14.23 1 13 1 12 1 5.92 5.92 1 12 1s11 4.92 11 11-4.92 11-11 11c-.51 0-1.02-.04-1.52-.1l-3.38 4.93C8.67 23.94 10.3 24 12 24c6.63 0 12-5.37 12-12S18.63 0 12 0z"/>
                </svg>
                <span id="steam-btn-text">Steam Trade URL</span>
            </button>
        </div>
    </header>

    <div class="live-drops-bar">
        <div class="live-drops-track" id="drops-track"></div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('upgrade')">⚡ Апгрейдер</button>
        <button class="tab-btn" onclick="switchTab('cases')">📦 Кейсы</button>
    </div>

    <main>
        <!-- SCREEN: UPGRADER -->
        <section id="screen-upgrade" class="screen active">
            <div class="upgrader-wrapper">
                
                <!-- Left Slot (Your Skin / Balance) -->
                <div class="upgrade-col">
                    <div class="col-title">
                        <span>Ваша ставка</span>
                        <span id="left-item-type">Инвентарь</span>
                    </div>
                    <div class="active-slot" id="left-slot">
                        <span style="color: var(--text-muted); font-size: 13px;">Выберите предмет ниже</span>
                    </div>
                    <div class="selector-list" id="my-inventory-list"></div>
                </div>

                <!-- Center Wheel -->
                <div class="upgrader-center">
                    <div class="wheel-container">
                        <svg class="radial-track" viewBox="0 0 280 280">
                            <circle class="circle-bg" cx="140" cy="140" r="130"></circle>
                            <circle class="circle-bar" id="wheel-svg-bar" cx="140" cy="140" r="130"></circle>
                        </svg>
                        <div class="wheel-arrow" id="wheel-arrow"></div>
                        <div class="wheel-center-info">
                            <span class="chance-text" id="chance-display">0.00%</span>
                            <span class="chance-sub">Шанс успеха</span>
                        </div>
                    </div>
                    <button class="btn-upgrade" id="btn-do-upgrade" onclick="executeUpgrade()" disabled>
                        Сделать апгрейд
                    </button>
                </div>

                <!-- Right Slot (Desired Skin) -->
                <div class="upgrade-col">
                    <div class="col-title">
                        <span>Цель</span>
                        <span>Каталог</span>
                    </div>
                    <div class="active-slot" id="right-slot">
                        <span style="color: var(--text-muted); font-size: 13px;">Выберите желаемый скин</span>
                    </div>
                    <div class="selector-list" id="shop-skin-list"></div>
                </div>

            </div>
        </section>

        <!-- SCREEN: CASES -->
        <section id="screen-cases" class="screen">
            <div class="cases-grid" id="cases-catalog"></div>
        </section>
    </main>

    <!-- CASE ROULETTE MODAL -->
    <div class="modal-overlay" id="roulette-modal">
        <div class="case-open-box">
            <h2 id="modal-case-title" style="font-family: 'Chakra Petch'; color: #fff;">ОТКРЫТИЕ КЕЙСА</h2>
            <div class="roulette-wrapper">
                <div class="roulette-cursor"></div>
                <div class="roulette-track" id="roulette-track"></div>
            </div>
            <div id="roulette-result-display" style="margin-bottom: 16px; font-weight: 700; font-size: 16px; height: 24px;"></div>
            <button class="btn-modal-action" id="btn-spin-case" onclick="startCaseSpin()">Крутить за ₽100</button>
        </div>
    </div>

    <!-- STEAM CONFIG MODAL -->
    <div class="modal-overlay" id="steam-modal">
        <div class="steam-modal">
            <h3>Подключение Steam</h3>
            <div class="input-group">
                <label>Никнейм Steam</label>
                <input type="text" id="steam-nickname" placeholder="Например: s1mple">
            </div>
            <div class="input-group">
                <label>Ссылка на обмен (Trade URL)</label>
                <input type="text" id="steam-trade-url" placeholder="https://steamcommunity.com/tradeoffer/new/...">
            </div>
            <button class="btn-modal-action" onclick="saveSteamSettings()">Сохранить</button>
            <button style="background:transparent; border:none; color:var(--text-muted); cursor:pointer; font-size:12px;" onclick="closeSteamModal()">Отмена</button>
        </div>
    </div>

    <script>
        // High quality Steam CDN CS2 weapon renders
        const SKINS_DATABASE = [
            { id: 1, name: "P250 | Sand Dune", price: 25, rarity: "rarity-blue", color: "#4b69ff", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpopujwezhjxszYI2gS09-5mtW0m_7zO6-fzj9V7cAl2eyVpIrz2FKx_0NpY2zxctCSd1c-YF_Qq1Ltl-u61MW9upzInXNq7yV2-z-DyG2z4p0M/256fx256f" },

            { id: 9, name: "AWP | Dragon Lore", price: 290000, rarity: "rarity-gold", color: "#e4ae39", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpot621FABz7PLfYQJS5NO0m5O0m_7zO6-fkzgBup0l3-3A8Nzx3FftqUVuZT-mddDEdVI5MN7VqAPqxrvr0JS_6JXBmncx7iVw-z-DyOcfd_6Q/256fx256f" }
        ];

        const CASES = [
            { id: "case_starter", name: "Армейский кейс", price: 50, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXU5A1PIYQNqhpOSV-fRPasw8rsUFJ5KBFZv668FFU1nfbOIj8W7oWzkYLdlPOsMOmIk29u5cB1g_zMu92giw23qEs5YTyncNScJgU6N16G-FS8x-u71MXov5vMnXVqunIr4SndmRepwUYbm3537W4/256fx256f", pool: [1, 2, 3] },
            { id: "case_covert", name: "Тайный кейс", price: 650, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXU5A1PIYQNqhpOSV-fRPasw8rsUFJ5KBFZv668FFU4nbaecG1H-NmJko-ZlvnwNoTck29Y_cg_3-2Wo4mg2VDsqkRtZ2-mJoedd1dtY1vSrFS8wuvvg5S9vp7NzXFmvnUr52GdwULP455Rsw/256fx256f", pool: [3, 4, 5, 6] },
            { id: "case_knife", name: "Ножевой кейс", price: 4500, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXU5A1PIYQNqhpOSV-fRPasw8rsUFJ5KBFZv668FFY5naqQIz4X7YjvkdLfxfOmZe_UwzsJ65Up3uuV89Sn2wW3_0VsNmn1J4ecdw85YwmG-1K9lOq515Dot57KyHZg7yF252GdwUJkO6Jp2g/256fx256f", pool: [6, 7, 8, 9] }
        ];

        let state = {
            balance: parseFloat(localStorage.getItem('upg_balance') || '5000'),
            inventory: JSON.parse(localStorage.getItem('upg_inventory') || '[]'),
            steamNick: localStorage.getItem('upg_nick') || '',
            steamTradeUrl: localStorage.getItem('upg_trade') || '',
            selectedLeft: null,
            selectedRight: null,
            isUpgrading: false,
            currentCase: null
        };

        if (state.inventory.length === 0) {
            state.inventory = [
                { ...SKINS_DATABASE[0], uid: Date.now() + 1 },
                { ...SKINS_DATABASE[1], uid: Date.now() + 2 },
                { ...SKINS_DATABASE[2], uid: Date.now() + 3 }
            ];
            saveState();
        }

        function saveState() {
            localStorage.setItem('upg_balance', state.balance.toFixed(2));
            localStorage.setItem('upg_inventory', JSON.stringify(state.inventory));
            localStorage.setItem('upg_nick', state.steamNick);
            localStorage.setItem('upg_trade', state.steamTradeUrl);
            updateUI();
        }

        function updateUI() {
            document.getElementById('user-balance').innerText = state.balance.toLocaleString('ru-RU', { minimumFractionDigits: 2 });
            if (state.steamNick) {
                document.getElementById('steam-btn-text').innerText = state.steamNick;
            }
            renderInventory();
            renderShopCatalog();
            recalcUpgradeChance();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            if (tab === 'upgrade') {
                document.querySelector("button[onclick=\"switchTab('upgrade')\"]").classList.add('active');
                document.getElementById('screen-upgrade').classList.add('active');
            } else {
                document.querySelector("button[onclick=\"switchTab('cases')\"]").classList.add('active');
                document.getElementById('screen-cases').classList.add('active');
            }
        }

        // UPGRADER LOGIC WITH PERFECT MECHANICAL SYNC
        const CIRCUMFERENCE = 2 * Math.PI * 130; // 816.81

        function renderInventory() {
            const container = document.getElementById('my-inventory-list');
            container.innerHTML = '';
            state.inventory.forEach(item => {
                const isSelected = state.selectedLeft && state.selectedLeft.uid === item.uid;
                const el = document.createElement('div');
                el.className = `skin-item ${isSelected ? 'selected' : ''}`;
                el.onclick = () => selectLeft(item);
                el.innerHTML = `
                    <img src="${item.img}" alt="${item.name}">
                    <div class="skin-item-info">
                        <div class="skin-item-name ${item.rarity}">${item.name}</div>
                        <div class="skin-item-price">₽${item.price}</div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function renderShopCatalog() {
            const container = document.getElementById('shop-skin-list');
            container.innerHTML = '';
            SKINS_DATABASE.forEach(item => {
                const isSelected = state.selectedRight && state.selectedRight.id === item.id;
                const el = document.createElement('div');
                el.className = `skin-item ${isSelected ? 'selected' : ''}`;
                el.onclick = () => selectRight(item);
                el.innerHTML = `
                    <img src="${item.img}" alt="${item.name}">
                    <div class="skin-item-info">
                        <div class="skin-item-name ${item.rarity}">${item.name}</div>
                        <div class="skin-item-price">₽${item.price}</div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function selectLeft(item) {
            if (state.isUpgrading) return;
            state.selectedLeft = item;
            const slot = document.getElementById('left-slot');
            slot.className = 'active-slot filled';
            slot.innerHTML = `
                <img src="${item.img}">
                <div class="active-slot-name ${item.rarity}">${item.name}</div>
                <div class="active-slot-price">₽${item.price}</div>
            `;
            renderInventory();
            recalcUpgradeChance();
        }

        function selectRight(item) {
            if (state.isUpgrading) return;
            state.selectedRight = item;
            const slot = document.getElementById('right-slot');
            slot.className = 'active-slot filled';
            slot.innerHTML = `
                <img src="${item.img}">
                <div class="active-slot-name ${item.rarity}">${item.name}</div>
                <div class="active-slot-price">₽${item.price}</div>
            `;
            renderShopCatalog();
            recalcUpgradeChance();
        }

        let calculatedChance = 0;

        function recalcUpgradeChance() {
            const bar = document.getElementById('wheel-svg-bar');
            const display = document.getElementById('chance-display');
            const btn = document.getElementById('btn-do-upgrade');

            if (!state.selectedLeft || !state.selectedRight) {
                calculatedChance = 0;
                bar.style.strokeDashoffset = CIRCUMFERENCE;
                display.innerText = '0.00%';
                btn.disabled = true;
                return;
            }

            // Standard CS2 Upgrader math (capped between 1% and 80%)
            let rawChance = (state.selectedLeft.price / state.selectedRight.price) * 92;
            calculatedChance = Math.min(Math.max(rawChance, 1.0), 80.0);

            // Draw radial arc
            const offset = CIRCUMFERENCE - (calculatedChance / 100) * CIRCUMFERENCE;
            bar.style.strokeDashoffset = offset;
            display.innerText = calculatedChance.toFixed(2) + '%';
            btn.disabled = state.isUpgrading;
        }

        function executeUpgrade() {
            if (state.isUpgrading || calculatedChance <= 0) return;
            state.isUpgrading = true;
            document.getElementById('btn-do-upgrade').disabled = true;

            // Remove input item from inventory immediately
            state.inventory = state.inventory.filter(i => i.uid !== state.selectedLeft.uid);
            saveState();

            // Winning arc spans from 0 deg to targetDeg
            const targetDeg = (calculatedChance / 100) * 360;

            // Rigorous roll determination
            const isWin = Math.random() * 100 <= calculatedChance;

            let finalLandingAngle;
            if (isWin) {
                // Land strictly inside [2, targetDeg - 2]
                finalLandingAngle = Math.random() * (targetDeg - 4) + 2;
            } else {
                // Land strictly inside dark sector [targetDeg + 3, 357]
                const remainingSpan = 360 - targetDeg - 6;
                finalLandingAngle = targetDeg + 3 + (Math.random() * remainingSpan);
            }

            // Add 5 full rotations (1800 deg) for dramatic spin
            const totalRotation = 1800 + finalLandingAngle;
            const arrow = document.getElementById('wheel-arrow');

            arrow.style.transition = 'transform 4.5s cubic-bezier(0.12, 0.8, 0.2, 1)';
            arrow.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                if (isWin) {
                    const newItem = { ...state.selectedRight, uid: Date.now() };
                    state.inventory.unshift(newItem);
                    saveState();
                    alert(`🎉 УСПЕШНЫЙ АПГРЕЙД!\nВы выиграли: ${newItem.name} (₽${newItem.price})`);
                } else {
                    alert('🛑 Апгрейд не удался. Предмет сгорел.');
                }

                // Reset positions
                arrow.style.transition = 'none';
                arrow.style.transform = `rotate(${finalLandingAngle % 360}deg)`;
                state.selectedLeft = null;
                document.getElementById('left-slot').className = 'active-slot';
                document.getElementById('left-slot').innerHTML = '<span style="color: var(--text-muted); font-size: 13px;">Выберите предмет ниже</span>';
                state.isUpgrading = false;
                updateUI();
            }, 4600);
        }

        // CASES INITIALIZATION
        function initCases() {
            const container = document.getElementById('cases-catalog');
            container.innerHTML = '';
            CASES.forEach(c => {
                const el = document.createElement('div');
                el.className = 'case-card';
                el.onclick = () => openCaseModal(c);
                el.innerHTML = `
                    <img src="${c.img}" alt="${c.name}">
                    <div class="case-title">${c.name}</div>
                    <div class="case-price">₽${c.price}</div>
                `;
                container.appendChild(el);
            });
        }

        function openCaseModal(caseObj) {
            state.currentCase = caseObj;
            document.getElementById('modal-case-title').innerText = caseObj.name.toUpperCase();
            document.getElementById('btn-spin-case').innerText = `Открыть за ₽${caseObj.price}`;
            document.getElementById('roulette-result-display').innerText = '';

            const track = document.getElementById('roulette-track');
            track.innerHTML = '';
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';

            // Populate preview items
            for (let i = 0; i < 60; i++) {
                const randomId = caseObj.pool[Math.floor(Math.random() * caseObj.pool.length)];
                const item = SKINS_DATABASE.find(s => s.id === randomId);
                const card = document.createElement('div');
                card.className = 'roulette-card';
                card.innerHTML = `
                    <img src="${item.img}">
                    <div class="name ${item.rarity}">${item.name}</div>
                    <div class="tier-line" style="background: ${item.color}"></div>
                `;
                track.appendChild(card);
            }

            document.getElementById('roulette-modal').classList.add('active');
        }

        let isSpinningCase = false;
        function startCaseSpin() {
            if (isSpinningCase || !state.currentCase) return;
            if (state.balance < state.currentCase.price) {
                alert('Недостаточно средств на балансе!');
                return;
            }

            state.balance -= state.currentCase.price;
            saveState();
            isSpinningCase = true;
            document.getElementById('btn-spin-case').disabled = true;

            const poolItems = state.currentCase.pool.map(id => SKINS_DATABASE.find(s => s.id === id));
            // Realistic Valve-like weighted drop
            const winItem = poolItems[Math.floor(Math.random() * (poolItems.length > 2 ? 2 : poolItems.length))];

            const track = document.getElementById('roulette-track');
            // The item at index 48 is the target winner
            const targetIndex = 48;
            const cards = track.children;
            cards[targetIndex].innerHTML = `
                <img src="${winItem.img}">
                <div class="name ${winItem.rarity}">${winItem.name}</div>
                <div class="tier-line" style="background: ${winItem.color}"></div>
            `;

            // Calculate precise pixel distance to center of target card
            const cardWidth = 130;
            const containerWidth = document.querySelector('.roulette-wrapper').offsetWidth;
            const randomOffsetInsideCard = Math.floor(Math.random() * 80) - 40;
            const targetScrollX = (targetIndex * cardWidth) - (containerWidth / 2) + (cardWidth / 2) + randomOffsetInsideCard;

            track.style.transition = 'transform 5s cubic-bezier(0.1, 0.9, 0.2, 1)';
            track.style.transform = `translateX(-${targetScrollX}px)`;

            setTimeout(() => {
                state.inventory.unshift({ ...winItem, uid: Date.now() });
                saveState();
                document.getElementById('roulette-result-display').innerHTML = `Выпало: <span class="${winItem.rarity}">${winItem.name}</span> (₽${winItem.price})`;
                document.getElementById('btn-spin-case').disabled = false;
                isSpinningCase = false;
            }, 5200);
        }

        // LIVE FEED GENERATION
        function initLiveFeed() {
            const track = document.getElementById('drops-track');
            for (let i = 0; i < 20; i++) {
                const item = SKINS_DATABASE[Math.floor(Math.random() * SKINS_DATABASE.length)];
                const el = document.createElement('div');
                el.className = 'mini-drop-card';
                el.style.borderBottomColor = item.color;
                el.innerHTML = `
                    <img src="${item.img}">
                    <div class="mini-drop-info">
                        <span class="name">${item.name}</span>
                        <span class="price">₽${item.price}</span>
                    </div>
                `;
                track.appendChild(el);
            }
        }

        // STEAM MODAL HANDLERS
        function openSteamModal() {
            document.getElementById('steam-nickname').value = state.steamNick;
            document.getElementById('steam-trade-url').value = state.steamTradeUrl;
            document.getElementById('steam-modal').classList.add('active');
        }

        function closeSteamModal() {
            document.getElementById('steam-modal').classList.remove('active');
        }

        function saveSteamSettings() {
            state.steamNick = document.getElementById('steam-nickname').value.trim();
            state.steamTradeUrl = document.getElementById('steam-trade-url').value.trim();
            saveState();
            closeSteamModal();
        }

        // Close modal on background click
        window.onclick = function(e) {
            if (e.target.classList.contains('modal-overlay')) {
                if (!isSpinningCase) {
                    e.target.classList.remove('active');
                }
            }
        };

        // RUN
        initCases();
        initLiveFeed();
        updateUI();
    </script>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мастерская Натуральных Свечей</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --accent: #f59e0b;
      --text: #f0f6fc;
      --muted: #8b949e;
      --success: #238636;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; padding-bottom: 90px; user-select: none; }

    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { font-size: 20px; color: var(--accent); }
    .header p { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn {
      flex: 1; padding: 10px; background: var(--card); border: 1px solid var(--border);
      color: var(--muted); border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer;
    }
    .tab-btn.active { background: #d97706; color: #fff; border-color: var(--accent); }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; margin-bottom: 12px;
    }

    .catalog-item { display: flex; justify-content: space-between; align-items: center; }
    .item-info { flex: 1; padding-right: 10px; }
    .item-title { font-size: 14px; font-weight: bold; }
    .item-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .item-price { font-size: 14px; color: var(--accent); font-weight: bold; margin-top: 4px; }

    .qty-controls { display: flex; align-items: center; gap: 8px; }
    .btn-qty {
      background: #21262d; border: 1px solid var(--border); color: #fff;
      width: 32px; height: 32px; border-radius: 6px; font-size: 16px; font-weight: bold;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .btn-qty:active { background: #30363d; }
    .qty-display { font-size: 14px; font-weight: bold; min-width: 20px; text-align: center; }

    .btn-add-main {
      background: #d97706; color: #fff; border: none; padding: 8px 14px;
      border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
    }

    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .field input {
      width: 100%; background: #090d13; border: 1px solid var(--border);
      padding: 8px 10px; border-radius: 6px; color: #fff; font-size: 14px; outline: none;
    }

    .calc-res {
      background: #090d13; border: 1px dashed var(--accent); border-radius: 8px;
      padding: 10px; margin-top: 10px; font-size: 13px; line-height: 1.5;
    }

    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
      border-top: 1px solid var(--border); padding: 12px 16px; display: flex;
      justify-content: space-between; align-items: center; z-index: 100;
    }
    .order-btn {
      background: var(--success); color: #fff; border: none; padding: 10px 18px;
      border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer;
    }
    .order-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🕯 Мастерская Свечей</h1>
    <p>100% натуральный пчелиный воск & ручная работа</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="setTab('catalog')">📦 Каталог</button>
    <button class="tab-btn" onclick="setTab('calc')">📐 Калькулятор воска</button>
  </div>

  <!-- КАТАЛОГ -->
  <div id="tabCatalog">
    <div id="catalogList"></div>
  </div>

  <!-- КАЛЬКУЛЯТОР -->
  <div id="tabCalc" style="display: none;">
    <div class="card">
      <div style="font-weight: bold; margin-bottom: 8px; font-size: 14px;">📐 Расчёт конусных свечей</div>
      <div class="field">
        <label>Длина свечи (см):</label>
        <input type="number" id="cLength" value="25" oninput="calcCandle()">
      </div>
      <div class="field">
        <label>Вес одной свечи (грамм):</label>
        <input type="number" id="cWeight" value="6.5" oninput="calcCandle()">
      </div>
      <div class="field">
        <label>Количество штук в партии:</label>
        <input type="number" id="cCount" value="33" oninput="calcCandle()">
      </div>

      <div class="calc-res" id="calcOutput">Расчёт...</div>
    </div>
  </div>

  <!-- КОРЗИНА -->
  <div class="bottom-bar">
    <div>
      <div style="font-size: 11px; color: var(--muted);">В заказе: <span id="cartCount">0</span> шт.</div>
      <div style="font-size: 16px; font-weight: bold; color: var(--accent);"><span id="cartTotal">0</span> ₽</div>
    </div>
    <button class="order-btn" id="btnOrder" disabled onclick="sendOrder()">Оформить заказ</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const PRODUCTS = [
      { id: "jerusalem_33", name: "🕯 Иерусалимские свечи (факел 33 шт)", desc: "Натуральный воск, обожжённые в Иерусалиме", price: 450 },
      { id: "voshina_honey", name: "🍯 Свечи из вощины (медовые)", desc: "Высота 13 см, диаметр 3 см, медовый аромат", price: 180 },
      { id: "altar_herbs", name: "🌿 Травяная алтарная свеча", desc: "С добавлением горного чабреца, лаванды и полыни", price: 250 },
      { id: "cone_church", name: "✨ Конусные свечи №40 (набор 10 шт)", desc: "Длина 20 см, чистое ровное горение", price: 220 }
    ];

    let cart = {};

    function renderCatalog() {
      const container = document.getElementById("catalogList");
      container.innerHTML = PRODUCTS.map(p => {
        const qty = cart[p.id] || 0;
        return `
          <div class="card">
            <div class="catalog-item">
              <div class="item-info">
                <div class="item-title">${p.name}</div>
                <div class="item-desc">${p.desc}</div>
                <div class="item-price">${p.price} ₽ / шт.</div>
              </div>
              <div>
                ${qty === 0 ? `
                  <button class="btn-add-main" onclick="changeQty('${p.id}', 1)">+ В заказ</button>
                ` : `
                  <div class="qty-controls">
                    <button class="btn-qty" onclick="changeQty('${p.id}', -1)">-</button>
                    <span class="qty-display">${qty}</span>
                    <button class="btn-qty" onclick="changeQty('${p.id}', 1)">+</button>
                  </div>
                `}
              </div>
            </div>
          </div>
        `;
      }).join("");

      updateCartSummary();
    }

    function changeQty(productId, delta) {
      const current = cart[productId] || 0;
      const next = current + delta;
      if (next <= 0) {
        delete cart[productId];
      } else {
        cart[productId] = next;
      }
      renderCatalog();
    }

    function updateCartSummary() {
      let totalCount = 0;
      let totalPrice = 0;

      for (const [pId, q] of Object.entries(cart)) {
        const prod = PRODUCTS.find(p => p.id === pId);
        if (prod) {
          totalCount += q;
          totalPrice += prod.price * q;
        }
      }

      document.getElementById("cartCount").innerText = totalCount;
      document.getElementById("cartTotal").innerText = totalPrice;
      document.getElementById("btnOrder").disabled = totalCount === 0;
    }

    function setTab(name) {
      document.getElementById('tabCatalog').style.display = name === 'catalog' ? 'block' : 'none';
      document.getElementById('tabCalc').style.display = name === 'calc' ? 'block' : 'none';
      const btns = document.querySelectorAll('.tab-btn');
      btns[0].classList.toggle('active', name === 'catalog');
      btns[1].classList.toggle('active', name === 'calc');
      if (name === 'calc') calcCandle();
    }

    function calcCandle() {
      const L = parseFloat(document.getElementById('cLength').value) || 0;
      const W = parseFloat(document.getElementById('cWeight').value) || 0;
      const count = parseInt(document.getElementById('cCount').value) || 1;

      if (L <= 0 || W <= 0) return;

      const density = 0.96;
      const volume = W / density;
      const avgDiameterCm = 2 * Math.sqrt(volume / (Math.PI * L));
      const avgDiameterMm = (avgDiameterCm * 10).toFixed(2);
      const totalWaxKg = ((W * count) / 1000).toFixed(3);

      document.getElementById('calcOutput').innerHTML = `
        • Средний диаметр свечи: <b>~${avgDiameterMm} мм</b><br>
        • Объём одной свечи: <b>${volume.toFixed(2)} см³</b><br>
        • Воска на партию (${count} шт): <b>${totalWaxKg} кг</b>
      `;
    }

    function sendOrder() {
      const orderItems = [];
      let totalSum = 0;

      for (const [pId, q] of Object.entries(cart)) {
        const prod = PRODUCTS.find(p => p.id === pId);
        if (prod) {
          orderItems.push({
            name: prod.name,
            qty: q,
            price: prod.price,
            subtotal: prod.price * q
          });
          totalSum += prod.price * q;
        }
      }

      if (orderItems.length === 0) return;

      const payload = {
        action: "new_candle_order",
        items: orderItems,
        total: totalSum
      };

      if (tg && tg.initData) {
        tg.sendData(JSON.stringify(payload));
      } else {
        alert(`Заказ на сумму ${totalSum} ₽ сформирован!\n(Откройте через Telegram для отправки боту)`);
      }
    }

    renderCatalog();
    calcCandle();
  </script>
</body>
</html>

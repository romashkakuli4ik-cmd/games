<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ROMAN | Secure Anonymous Network</title>
    <style>
        :root {
            --bg-color: #06080e;
            --panel-bg: rgba(14, 18, 28, 0.94);
            --border-color: #1e283d;
            --accent-color: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.35);
            --secondary-accent: #7000ff;
            --danger-color: #ff3366;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --font-stack: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(112, 0, 255, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 240, 255, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* ЭКРАН ВХОДА В СЕТЬ */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(6, 8, 14, 0.98);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 25px var(--accent-glow);
            border-radius: 18px;
            width: 100%;
            max-width: 440px;
            padding: 32px 28px;
            text-align: center;
        }

        .auth-logo {
            font-size: 30px;
            font-weight: 900;
            color: var(--accent-color);
            letter-spacing: 4px;
            margin-bottom: 6px;
            text-shadow: 0 0 16px var(--accent-color);
        }

        .auth-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 26px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            font-weight: 700;
        }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .input-field:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, var(--secondary-accent), var(--accent-color));
            color: #fff;
            font-size: 13px;
            font-weight: 900;
            font-family: inherit;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: transform 0.15s, opacity 0.2s;
            margin-top: 6px;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР ПРИЛОЖЕНИЯ */
        #app-container {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: row;
            background: var(--bg-color);
        }

        /* САЙДБАР */
        .sidebar {
            width: 320px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 900;
            color: var(--accent-color);
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .badge-status {
            font-size: 9px;
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 800;
        }

        .room-meta {
            padding: 14px 20px;
            background: #090d16;
            border-bottom: 1px solid var(--border-color);
            font-size: 11px;
        }

        .room-meta-item {
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .room-meta-item:last-child {
            margin-bottom: 0;
        }

        .room-meta-item span:first-child {
            color: var(--text-muted);
        }

        .room-meta-item span:last-child {
            color: var(--accent-color);
            font-weight: 700;
        }

        .peers-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .section-title {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .peer-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            background: #090e1a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .peer-avatar {
            width: 8px;
            height: 8px;
            background: var(--accent-color);
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 8px var(--accent-color);
        }

        /* ОБЛАСТЬ ЧАТА */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #07090f;
        }

        .chat-header {
            height: 65px;
            padding: 0 24px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .call-controls {
            display: flex;
            gap: 10px;
        }

        .btn-call {
            background: #0f1523;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .btn-call:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn-call.danger {
            background: rgba(255, 51, 102, 0.15);
            border-color: var(--danger-color);
            color: var(--danger-color);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            user-select: text;
        }

        .message-bubble {
            max-width: 65%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.5;
            position: relative;
            word-break: break-word;
        }

        .message-bubble.incoming {
            align-self: flex-start;
            background: #0d1320;
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 2px;
        }

        .message-bubble.outgoing {
            align-self: flex-end;
            background: #112030;
            border: 1px solid #00a2b0;
            border-bottom-right-radius: 2px;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .outgoing .message-header {
            color: var(--accent-color);
        }

        .file-attachment {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 8px;
            margin-top: 6px;
            border: 1px dashed var(--border-color);
        }

        .file-download-btn {
            background: var(--accent-color);
            color: #000;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 11px;
            font-weight: 900;
        }

        .chat-input-bar {
            padding: 16px 24px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            font-family: inherit;
        }

        .chat-input:focus {
            border-color: var(--accent-color);
        }

        .btn-action-icon {
            background: #0f1523;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-action-icon:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* WEBRTC ВИДЕО ОКНО */
        #video-modal {
            display: none;
            position: absolute;
            top: 20px;
            right: 20px;
            width: 480px;
            height: 360px;
            background: #04060a;
            border: 1px solid var(--accent-color);
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 20px var(--accent-glow);
            z-index: 1000;
            overflow: hidden;
            flex-direction: column;
        }

        .video-wrapper {
            flex: 1;
            position: relative;
            background: #000;
        }

        video#remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        video#localVideo {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 120px;
            height: 90px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--accent-color);
            box-shadow: 0 0 10px rgba(0,0,0,0.6);
            transform: scaleX(-1);
        }

        .video-actions {
            height: 52px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        @media (max-width: 768px) {
            #app-container { flex-direction: column; }
            .sidebar { width: 100%; height: 180px; }
            #video-modal { width: 92%; height: 260px; top: 10px; right: 4%; }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА ROMAN -->
    <div id="auth-overlay">
        <div class="auth-card">
            <div class="auth-logo">ROMAN</div>
            <div class="auth-subtitle">Zero-Knowledge E2EE Mesh Platform</div>

            <div class="input-group">
                <label>Идентификатор Комнаты (Room ID)</label>
                <input type="text" id="roomIdInput" class="input-field" placeholder="Например: roman-node-7">
            </div>

            <div class="input-group">
                <label>Ключ Шифрования (Master Passphrase)</label>
                <input type="password" id="passphraseInput" class="input-field" placeholder="Секретная фраза для AES-256">
            </div>

            <button class="btn-primary" onclick="initSession()">Войти в Анонимный Канал</button>
        </div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС ROMAN -->
    <div id="app-container">
        <!-- САЙДБАР -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span class="brand-name">ROMAN</span>
                <span class="badge-status">E2EE MESH</span>
            </div>

            <div class="room-meta">
                <div class="room-meta-item">
                    <span>КОМНАТА:</span>
                    <span id="displayRoomId">-</span>
                </div>
                <div class="room-meta-item">
                    <span>ШИФР:</span>
                    <span>AES-GCM-256</span>
                </div>
                <div class="room-meta-item">
                    <span>СЕТЬ:</span>
                    <span>P2P / WebRTC / SOCKS5</span>
                </div>
            </div>

            <div class="peers-list-container">
                <div class="section-title">Активные Узлы (<span id="peerCount">0</span>)</div>
                <div id="peersList"></div>
            </div>
        </div>

        <!-- ОСНОВНОЙ ЧАТ -->
        <div class="chat-main">
            <div class="chat-header">
                <div style="font-size: 12px; color: var(--accent-color); font-weight: 800;">
                    ● ЗАЩИЩЁННЫЙ КАНАЛ СВЯЗИ ROMAN
                </div>
                <div class="call-controls">
                    <button class="btn-call" onclick="startCall(false)">
                        📞 Голос
                    </button>
                    <button class="btn-call" onclick="startCall(true)">
                        📹 Видео
                    </button>
                    <button class="btn-call danger" id="endCallBtn" style="display: none;" onclick="terminateCall()">
                        🛑 Сброс
                    </button>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer"></div>

            <div class="chat-input-bar">
                <input type="file" id="fileInput" style="display: none;" onchange="handleFileUpload(event)">
                <button class="btn-action-icon" title="Зашифровать и отправить файл" onclick="document.getElementById('fileInput').click()">
                    📎
                </button>
                <input type="text" id="chatInput" class="chat-input" placeholder="Введите зашифрованное сообщение..." onkeypress="handleKeyPress(event)">
                <button class="btn-primary" style="width: auto; padding: 12px 22px; margin-top: 0;" onclick="sendTextMessage()">
                    ОТПРАВИТЬ
                </button>
            </div>

            <!-- ОКНО WEBRTC ЗВОНКА -->
            <div id="video-modal">
                <div class="video-wrapper">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <video id="localVideo" autoplay playsinline muted></video>
                </div>
                <div class="video-actions">
                    <button class="btn-call danger" onclick="terminateCall()">Завершить Звонок</button>
                </div>
            </div>
        </div>
    </div>

    <!-- КРИПТОГРАФИЧЕСКИЙ ДВИЖОК И WEBRTC-МЕНЕДЖЕР -->
    <script>
        let ws = null;
        let cryptoKey = null;
        let activeRoom = null;
        let localPeerId = null;
        let activePeers = new Set();

        let peerConnection = null;
        let localStream = null;
        let currentCallTarget = null;

        // Отказоустойчивые STUN-серверы Google для обхода NAT
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        };

        // ======================= КРИПТОГРАФИЯ (AES-GCM-256 + PBKDF2) =======================
        async function deriveKey(passphrase, saltStr = "ROMAN_SECURE_SALT_2026") {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw",
                enc.encode(passphrase),
                { name: "PBKDF2" },
                false,
                ["deriveBits", "deriveKey"]
            );

            return await window.crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: enc.encode(saltStr),
                    iterations: 100000,
                    hash: "SHA-256"
                },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt", "decrypt"]
            );
        }

        async function encryptData(text) {
            const enc = new TextEncoder();
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const cipherBuffer = await window.crypto.subtle.encrypt(
                { name: "AES-GCM", iv: iv },
                cryptoKey,
                enc.encode(text)
            );

            return {
                iv: Array.from(iv),
                cipher: Array.from(new Uint8Array(cipherBuffer))
            };
        }

        async function decryptData(encryptedPayload) {
            try {
                const iv = new Uint8Array(encryptedPayload.iv);
                const cipher = new Uint8Array(encryptedPayload.cipher);
                const decryptedBuffer = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv },
                    cryptoKey,
                    cipher
                );
                return new TextDecoder().decode(decryptedBuffer);
            } catch (e) {
                return "[ROMAN: Ошибка дешифрования. Несовпадение мастер-ключа]";
            }
        }

        // ======================= ИНИЦИАЛИЗАЦИЯ СЕССИИ =======================
        async function initSession() {
            const roomId = document.getElementById('roomIdInput').value.trim();
            const pass = document.getElementById('passphraseInput').value.trim();

            if (!roomId || !pass) {
                alert("Укажите идентификатор комнаты и секретный ключ!");
                return;
            }

            activeRoom = roomId;
            cryptoKey = await deriveKey(pass);

            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            document.getElementById('displayRoomId').innerText = activeRoom;

            connectWebSocket();
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                ws.send(JSON.stringify({
                    type: 'JOIN_ROOM',
                    roomId: activeRoom
                }));
            };

            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);

                switch (data.type) {
                    case 'ROOM_JOINED':
                        localPeerId = data.yourId;
                        data.peers.forEach(peerId => activePeers.add(peerId));
                        updatePeersUI();
                        break;

                    case 'PEER_JOINED':
                        activePeers.add(data.peerId);
                        updatePeersUI();
                        appendSystemMessage(`Подключился узел: ${data.peerId.substring(0, 8)}`);
                        break;

                    case 'PEER_LEFT':
                        activePeers.delete(data.peerId);
                        updatePeersUI();
                        appendSystemMessage(`Отключился узел: ${data.peerId.substring(0, 8)}`);
                        if (currentCallTarget === data.peerId) {
                            terminateCall();
                        }
                        break;

                    case 'ENCRYPTED_MESSAGE':
                        const decryptedText = await decryptData(data.payload);
                        appendMessage(decryptedText, 'incoming', data.senderId);
                        break;

                    case 'ENCRYPTED_FILE':
                        const decryptedFileMeta = await decryptData(data.payload);
                        const fileObj = JSON.parse(decryptedFileMeta);
                        appendFileMessage(fileObj, 'incoming', data.senderId);
                        break;

                    case 'WEBRTC_SIGNAL':
                        handleWebRTCSignal(data.senderId, data.signalData);
                        break;

                    case 'CALL_TERMINATE':
                        terminateCall(false);
                        break;
                }
            };

            ws.onclose = () => {
                appendSystemMessage("Соединение с сервером прервано. Переподключение...");
                setTimeout(connectWebSocket, 3000);
            };
        }

        function updatePeersUI() {
            const container = document.getElementById('peersList');
            const counter = document.getElementById('peerCount');
            container.innerHTML = '';
            counter.innerText = activePeers.size;

            activePeers.forEach(peerId => {
                const div = document.createElement('div');
                div.className = 'peer-item';
                div.innerHTML = `<div class="peer-avatar"></div><span>Узел_${peerId.substring(0, 8)}</span>`;
                container.appendChild(div);
            });
        }

        // ======================= СООБЩЕНИЯ И ФАЙЛЫ =======================
        async function sendTextMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message || !ws || ws.readyState !== WebSocket.OPEN) return;

            const encrypted = await encryptData(message);
            ws.send(JSON.stringify({
                type: 'ENCRYPTED_MESSAGE',
                payload: encrypted
            }));

            appendMessage(message, 'outgoing', 'ВЫ');
            input.value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendTextMessage();
        }

        function appendMessage(text, direction, sender) {
            const container = document.getElementById('messagesContainer');
            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${direction}`;

            const time = new Date().toLocaleTimeString().substring(0, 5);
            bubble.innerHTML = `
                <div class="message-header">
                    <span>${sender.substring(0, 10)}</span>
                    <span>${time}</span>
                </div>
                <div>${escapeHTML(text)}</div>
            `;

            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
        }

        function appendSystemMessage(text) {
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.style.textAlign = 'center';
            div.style.fontSize = '11px';
            div.style.color = 'var(--text-muted)';
            div.style.margin = '6px 0';
            div.innerText = `[ROMAN] ${text}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 25 * 1024 * 1024) {
                alert("Максимальный размер передаваемого файла: 25 МБ!");
                return;
            }

            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64Data = e.target.result;
                const fileMetadata = JSON.stringify({
                    name: file.name,
                    size: file.size,
                    type: file.type,
                    data: base64Data
                });

                const encrypted = await encryptData(fileMetadata);
                ws.send(JSON.stringify({
                    type: 'ENCRYPTED_FILE',
                    payload: encrypted
                }));

                appendFileMessage({ name: file.name, size: file.size, data: base64Data }, 'outgoing', 'ВЫ');
            };
            reader.readAsDataURL(file);
        }

        function appendFileMessage(fileObj, direction, sender) {
            const container = document.getElementById('messagesContainer');
            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${direction}`;

            const time = new Date().toLocaleTimeString().substring(0, 5);
            const sizeFormatted = (fileObj.size / 1024).toFixed(1) + ' KB';

            bubble.innerHTML = `
                <div class="message-header">
                    <span>${sender.substring(0, 10)}</span>
                    <span>${time}</span>
                </div>
                <div class="file-attachment">
                    <span>📁</span>
                    <div style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                        <div>${escapeHTML(fileObj.name)}</div>
                        <div style="font-size:10px; color:var(--text-muted);">${sizeFormatted}</div>
                    </div>
                    <a href="${fileObj.data}" download="${escapeHTML(fileObj.name)}" class="file-download-btn">СКАЧАТЬ</a>
                </div>
            `;

            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
        }

        // ======================= P2P ЗВОНКИ И ВИДЕО (WebRTC) =======================
        async function startCall(videoEnabled = false) {
            if (activePeers.size === 0) {
                alert("В комнате нет доступных собеседников!");
                return;
            }

            currentCallTarget = Array.from(activePeers)[0];

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: videoEnabled
                });

                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('video-modal').style.display = 'flex';
                document.getElementById('endCallBtn').style.display = 'inline-flex';

                initPeerConnection(currentCallTarget);
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                ws.send(JSON.stringify({
                    type: 'WEBRTC_SIGNAL',
                    payload: {
                        targetPeerId: currentCallTarget,
                        signalData: { type: 'offer', sdp: offer.sdp, video: videoEnabled }
                    }
                }));
            } catch (err) {
                alert("Ошибка доступа к медиа-устройствам: " + err.message);
            }
        }

        function initPeerConnection(targetPeerId) {
            peerConnection = new RTCPeerConnection(rtcConfig);

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && ws) {
                    ws.send(JSON.stringify({
                        type: 'WEBRTC_SIGNAL',
                        payload: {
                            targetPeerId: targetPeerId,
                            signalData: { type: 'candidate', candidate: event.candidate }
                        }
                    }));
                }
            };

            peerConnection.ontrack = (event) => {
                const remoteVideo = document.getElementById('remoteVideo');
                if (remoteVideo.srcObject !== event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                }
            };
        }

        async function handleWebRTCSignal(senderId, signal) {
            if (signal.type === 'offer') {
                const accept = confirm(`ROMAN: Входящий ${signal.video ? 'видеозвонок' : 'аудиозвонок'} от узла ${senderId.substring(0, 8)}. Ответить?`);
                if (!accept) {
                    terminateCall();
                    return;
                }

                currentCallTarget = senderId;
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: signal.video
                });

                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('video-modal').style.display = 'flex';
                document.getElementById('endCallBtn').style.display = 'inline-flex';

                initPeerConnection(senderId);
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: signal.sdp }));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                ws.send(JSON.stringify({
                    type: 'WEBRTC_SIGNAL',
                    payload: {
                        targetPeerId: senderId,
                        signalData: { type: 'answer', sdp: answer.sdp }
                    }
                }));

            } else if (signal.type === 'answer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: signal.sdp }));
            } else if (signal.type === 'candidate') {
                if (peerConnection) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(signal.candidate));
                }
            }
        }

        function terminateCall(notify = true) {
            if (notify && ws && currentCallTarget) {
                ws.send(JSON.stringify({ type: 'CALL_TERMINATE' }));
            }

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            document.getElementById('video-modal').style.display = 'none';
            document.getElementById('endCallBtn').style.display = 'none';
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            currentCallTarget = null;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
